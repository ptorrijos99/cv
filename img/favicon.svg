<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#B30033" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Nodes -->
  <circle cx="50" cy="20" r="12" fill="#B30033" stroke="none" />
  <circle cx="20" cy="80" r="12" fill="#B30033" stroke="none" />
  <circle cx="80" cy="80" r="12" fill="#B30033" stroke="none" />
  
  <!-- Edges -->
  <line x1="50" y1="20" x2="20" y2="80" />
  <line x1="50" y1="20" x2="80" y2="80" />
  <line x1="20" y1="80" x2="80" y2="80" />
</svg>
